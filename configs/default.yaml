# research-harness 默认配置
project_root: ".."  # 相对于本配置文件
skills_file: "configs/skills.yaml"

# LLM API（当前接入 Agnes AI 的 OpenAI 兼容协议）
llm:
  protocol: "openai_compatible"
  api_key: ""          # 留空则从 api_key_env 指定的环境变量读取
  api_key_env: "AGNES_API_KEY"
  base_url: "https://apihub.agnes-ai.com/v1"
  default_model: "agnes-3.0-flash"
  timeout: 120

# 路径
paths:
  sessions_dir: "sessions"
  memory_dir: "memory"
  workflows_dir: "workflows"

# 工作流
workflow:
  default: "workflows/research.yaml"
  resume: true           # 默认断点续跑

# Agent 配置
agents:
  planner:
    use_extended_thinking: false
  method:
    use_extended_thinking: false
  reviewer:
    use_extended_thinking: false
  literature:
    use_extended_thinking: false
  coder:
    use_extended_thinking: false
  writer:
    use_extended_thinking: false
  executor:
    timeout: 600
    install_dependencies: true  # 安装到 session/.venv，不修改主环境
    run_entry_point: false      # 默认仅快速验证；true 额外执行训练入口
    entry_args: []              # 正式实验的入口参数，如 [--config, configs/default.yaml]
    enable_code_review: false
    require_metrics: false      # 正式入口可要求 HARNESS_METRICS=<numeric JSON>

# 日志
logging:
  level: "INFO"          # DEBUG | INFO | WARNING | ERROR
  file: "harness.log"
