# Skills 配置文件
# 定义可用的 skills 及其参数

skills:
  code_review:
    enabled: true
    description: "对代码进行静态分析和质量审查"
    auto_trigger: false  # 是否在 coding 阶段后自动触发

  dependency_check:
    enabled: true
    description: "检查当前环境安装版本和版本约束；不执行漏洞扫描"
    auto_trigger: false

  test_generation:
    enabled: true
    description: "为给定代码自动生成单元测试"
    auto_trigger: false

# 自定义 skills 通过 Python SkillRegistry.register() 注册。
# auto_trigger=true 在 coding 校验通过后运行，并将结果写入 coding.skill_results。
